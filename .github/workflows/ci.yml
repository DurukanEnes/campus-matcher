# WBS-11.1 — CI pipeline
# Runs on every pull request and on every push to main.
# A failing check blocks the PR once branch protection requires these jobs.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile (typecheck + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --ci

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The backend is not on main yet. Until requirements.txt exists,
      # this job passes without running anything.
      - name: Check for backend
        id: detect
        run: |
          if [ -f requirements.txt ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No requirements.txt found; backend checks skipped."
          fi

      - uses: actions/setup-python@v6
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: ruff check .

      # pytest exits with code 5 when it finds no tests; that should not fail CI.
      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        run: |
          set +e
          python -m pytest
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::notice::No backend tests found yet."
            exit 0
          fi
          exit "$code"
